[package]
name = "betterac"
version.workspace = true
edition.workspace = true
description = "A native GTK4 launcher for Asheron's Call on Linux"
license.workspace = true
repository.workspace = true

[dependencies]
ac-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
async-channel = "2"

[[bin]]
name = "betterac"
path = "src/main.rs"

# No packaging metadata here. betterAC is distributed as a tarball installed into
# ~/.local by install.sh, precisely because the things it *drives* cannot be
# expressed as package dependencies: `core/src/proton.rs` hard-fails setup without
# umu-run, which Debian and Ubuntu do not package at all, and a Flatpak cannot run
# the game (its sandbox SIGSYS-kills wine-preloader).
