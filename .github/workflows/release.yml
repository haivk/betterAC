# Build the shipping artifacts and publish them.
#
# **Every commit to main is a release.** There is no tagging step and no stable
# channel: push to main and it ships. The tag (`v2026.07.27.42`) is created here,
# from the build, rather than being something a human pushes.
#
# Versions are dated -- `YYYY.MM.DD.<run number>` -- so every build has a distinct,
# ordered version. That is not cosmetic: Homebrew decides whether an upgrade exists
# by comparing the cask's version string, so republishing under one version would
# leave Mac users pinned to whatever they installed first. It also cannot live in
# Cargo.toml, which requires semver X.Y.Z, so the build scripts take it as
# $VERSION and the workspace version is only a local-build fallback.
#
# The real work lives in packaging/*.sh so it can be run and debugged on a
# developer machine instead of only inside Actions. Steps here stay one-liners.
#
# Signing is optional, deliberately. Without the Apple secrets below the macOS
# job still builds an ad-hoc DMG so the rest of the release is not held hostage --
# but that DMG is left on the run page and never published, because Gatekeeper
# refuses to open an unsigned build and the cask says so.
#
#   APPLE_CERT_P12         base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD    password for that .p12
#   APPLE_SIGN_IDENTITY    e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID               Apple ID email used for notarization
#   APPLE_APP_PASSWORD     app-specific password for that Apple ID
#   APPLE_TEAM_ID          10-character team identifier
name: Release

on:
  push:
    branches: [main]
    # The cask commit below pushes to main. Pushes made with GITHUB_TOKEN do not
    # trigger workflows, so this cannot loop -- the path filter is a second belt.
    paths-ignore: ["Casks/**"]
  workflow_dispatch:

# A burst of pushes to main must not queue up a notarization each: only the
# newest commit's build is worth finishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One version for the whole run, computed once so every job agrees on it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          # Date + run number: ordered, obviously fresh, and unique per build even
          # when several land on the same day. GITHUB_RUN_NUMBER only increments.
          VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

  macos:
    needs: version
    runs-on: macos-15
    outputs:
      # "1" only when the DMG is signed *and* notarized. The publish job refuses
      # to attach it otherwise.
      signed: ${{ steps.cert.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen

      # A throwaway keychain, so the signing identity never touches the runner's
      # login keychain and is gone whatever happens below.
      #
      # No secrets configured is a supported state, not an error: the build
      # continues ad-hoc. `secrets` cannot be read from a job-level `if`, which
      # is why the decision is made here in a step and published as an output.
      - name: Import the Developer ID certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERT_P12 is not set -- building an ad-hoc DMG."
            echo "It will be left on this run page and NOT published: macOS would refuse to open it."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=1" >> "$GITHUB_OUTPUT"

      # build-dmg.sh already defaults to SIGN_IDENTITY=- (ad-hoc) and NOTARIZE=0,
      # so the unsigned path is simply not passing them.
      - name: Build, sign, notarize, staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # Baked into ac-core so the app knows its own version and the updater has
          # something to compare against. See core/build.rs.
          BETTERAC_VERSION: ${{ needs.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.signed == '1' && secrets.APPLE_SIGN_IDENTITY || '-' }}
          NOTARIZE: ${{ steps.cert.outputs.signed }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./packaging/macos/build-dmg.sh

      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    needs: version
    # The binary links the host's glibc, so the build box sets the floor for
    # every user -- normally an argument for the oldest runner available. 24.04
    # is the oldest that can build this at all: the v4_12/v1_5 feature gates in
    # gtk/Cargo.toml require gtk4 >= 4.12 and libadwaita-1 >= 1.5, and 22.04
    # ships 4.6 and 1.1. glibc 2.39 is the resulting floor, which matches what
    # gtk/install.sh:9-11 already documents for the shipped binary.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # Baked into the binary so `betterac --version` reports the release it
          # came from -- which is what install.sh prints when it proves the binary
          # runs here. See core/build.rs for why Cargo has to be told about it.
          BETTERAC_VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/linux/build-tarball.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, macos, linux]
    # Pushes only. On a workflow_dispatch run GITHUB_REF_NAME is the branch, so
    # this would happily create a release literally named "main"; a manual run is
    # for rehearsing the builds, and the artifacts are on the run page.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: this job commits the cask back to main, and git refuses to
      # push from the shallow clone checkout makes by default.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect artifacts
        env:
          SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -name '*.tar.gz' -exec mv {} dist/ \;
          if [ "$SIGNED" = "1" ]; then
            find staging -type f -name '*.dmg' -exec mv {} dist/ \;
          else
            echo "::warning::The macOS build was not signed, so no DMG is being published."
            echo "Add the six APPLE_* repository secrets; the unsigned DMG is on the macos job's page."
          fi
          ls -la dist/

      # VERSION comes from the version check, so this job needs no Rust toolchain.
      # Renders the Homebrew cask (only when a DMG is present) and SHA256SUMS --
      # which install.sh both verifies against and reads the artifact names out of.
      - name: Render package metadata
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/render-metadata.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          set -euo pipefail

          # Only what actually exists: no DMG and no cask on an unsigned build.
          ASSETS=(dist/SHA256SUMS)
          for f in dist/*.tar.gz dist/*.dmg dist/betterac.rb; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          {
            echo "## betterAC $VERSION"
            echo
            echo "Built from \`${GITHUB_SHA:0:7}\`."
            echo
            echo "### Install"
            echo '```sh'
            echo "# Linux and macOS -- downloads this release, verifies it, installs it"
            echo "curl -fsSL https://raw.githubusercontent.com/haivk/betterAC/main/install.sh | bash"
            if [ "$SIGNED" = "1" ]; then
              echo
              echo "# macOS via Homebrew (signed + notarized)"
              echo "brew tap haivk/betterac https://github.com/haivk/betterAC"
              echo "brew install --cask betterac"
            fi
            echo '```'
            echo
            echo "### Checksums"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

          # The tag is created here, from the build -- nobody pushes one by hand.
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "betterAC $VERSION" \
            --notes-file notes.md \
            "${ASSETS[@]}"

      # The tap is this repository, so CI owns the cask outright: it is generated
      # from the DMG that was just built, checksum and all, and never hand-edited.
      #
      # Skipped when the build was not signed -- there is no published DMG for a
      # cask to point at, and pointing it at one macOS refuses to open would be
      # worse than leaving the previous version in place.
      - name: Update the Homebrew cask
        if: needs.macos.outputs.signed == '1'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          [ -f dist/betterac.rb ] || { echo "no cask was rendered"; exit 0; }

          # The checkout is at the pushed commit; the cask belongs on main.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          mkdir -p Casks
          cp dist/betterac.rb Casks/betterac.rb
          git add Casks/betterac.rb
          if git diff --cached --quiet; then
            echo "cask unchanged"
            exit 0
          fi
          git commit -m "betterac $VERSION: update the Homebrew cask"
          git push origin main
